name: Build semantic paper map

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build upstream-derived EO-FM catalogue
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: eo-fm-paper-map-main
  cancel-in-progress: false

jobs:
  build-paper-map:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install semantic-map dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            openai \
            requests \
            scikit-learn \
            umap-learn

      - name: Restore abstract and embedding cache
        uses: actions/cache@v4
        with:
          path: data/paper-map-cache
          key: paper-map-${{ runner.os }}-${{ hashFiles('data/catalogue.json', 'data/benchmarks.json') }}
          restore-keys: |
            paper-map-${{ runner.os }}-

      - name: Build semantic paper map
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'text-embedding-3-small' }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: |
          python scripts/build_paper_map.py

      - name: Commit generated semantic map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/paper-map.json

          if git diff --cached --quiet; then
            echo "No semantic-map changes to commit."
            exit 0
          fi

          git commit -m "update semantic paper map"
          git pull --rebase origin main
          git push origin HEAD:main
